# AegisShield — local development environment.
#
# Exactly one Compose file: no version key, no override file, no include,
# and no container_name on any service. Every credential, name, and host
# port is interpolated from .env (see .env.example).
#
# Exactly one profile exists. The `tests` service carries profiles: ["test"]
# so a one-shot test runner does not start on every `docker compose up`; it
# runs via `docker compose run --rm tests`, which activates the profile by
# itself. Feature 001 wrote "no profiles" here as a statement about its own
# scope - it had nothing to put behind one - not as a ban. Justified in
# specs/002-transaction-event-pipeline/plan.md under Complexity Tracking.
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set - copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set - copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aegisshield-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2.4-management-alpine
    hostname: aegisshield-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is not set - copy .env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is not set - copy .env.example to .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:?RABBITMQ_DEFAULT_VHOST is not set - copy .env.example to .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q check_port_connectivity
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
    networks:
      - aegisshield-net
    restart: unless-stopped

networks:
  aegisshield-net:
    driver: bridge

volumes:
  rabbitmq-data:
  postgres-data: